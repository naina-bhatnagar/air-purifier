name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tools
        run: python -m pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests (no hardware needed)
        run: python -m pytest -q
      - name: Check the dashboard script parses
        run: |
          node -e "
          const h = require('fs').readFileSync('firmware/web/index.html', 'utf8');
          new Function(h.match(/<script>([\s\S]*)<\/script>/)[1]);
          console.log('dashboard script OK');"
